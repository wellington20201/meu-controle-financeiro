<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Controle Financeiro — Prévia V5.1</title><style>
:root{--bg:#f6f3eb;--panel:#fffdf8;--ink:#2f3733;--muted:#77817b;--sage:#7d9b88;--sage2:#dfe9df;--lav:#e9e4f2;--line:#e4e1d8;--shadow:0 16px 45px #44504414}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fbfaf5;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.brand{font-weight:750;font-size:17px;margin:0 8px 28px}.nav button{width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:12px;color:#6e7772;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:var(--sage2);color:#3f5c4b}.bottom{margin-top:auto;padding:12px;border-top:1px solid var(--line);color:var(--muted)}main{padding:34px;max-width:1200px;width:100%;margin:auto}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:#87938c}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.head h1{font-size:30px;margin:6px 0}.head p{color:var(--muted);margin:0}.btn{border:0;background:#6f927d;color:white;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card{padding:18px}.card span{color:var(--muted);font-size:12px}.card strong{display:block;font-size:22px;margin-top:9px}.cols{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel h3{margin:0 0 14px}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:15px 5px}.bar{flex:1;background:#b9cbbb;border-radius:8px 8px 3px 3px;min-height:20px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tag{background:var(--lav);padding:5px 8px;border-radius:20px;font-size:11px}.mascot{position:fixed;right:24px;bottom:22px;width:62px;height:62px;border-radius:50%;background:#fffdf8;border:1px solid var(--line);display:grid;place-items:center;font-size:32px;box-shadow:var(--shadow);cursor:pointer}.hidden{display:none}.mobile{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid var(--line);padding:8px;justify-content:space-around}.mobile button{border:0;background:none;padding:8px;color:var(--muted)}.mascot{bottom:68px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🌿 Meu Controle</div><nav class="nav" id="nav"></nav><div class="bottom">🐻 Bento<br><small>Seu dinheiro, sem complicação.</small></div></aside><main id="main"></main></div><div class="mobile" id="mobile"></div><button class="mascot" onclick="alert('Bento: Vamos cuidar das suas finanças com calma. Esta é uma prévia visual.')">🐻</button><script>
const pages={inicio:['Início','Acompanhe sua vida financeira com calma.'],lancamentos:['Lançamentos','Tudo que já aconteceu com seu dinheiro.'],contas:['Contas','Bancos, carteira e poupança.'],recorrencias:['Recorrências','Contas que se repetem e compromissos futuros.'],cartoes:['Cartões','Compras e parcelas registradas.'],metas:['Metas','Objetivos que você quer alcançar.'],assistente:['Assistente','Converse com o Meu Controle sobre seus próprios registros.'],config:['Configurações','Privacidade, segurança e seu mascote.']};let current='inicio';const icons={inicio:'⌂',lancamentos:'↕',contas:'▣',recorrencias:'↻',cartoes:'▤',metas:'◎',assistente:'◌',config:'⚙'};function renderNav(){nav.innerHTML=Object.keys(pages).map(k=>`<button class="${k===current?'active':''}" onclick="go('${k}')">${icons[k]} &nbsp;${pages[k][0]}</button>`).join('');mobile.innerHTML=Object.keys(pages).slice(0,5).map(k=>`<button onclick="go('${k}')">${icons[k]}<br>${pages[k][0]}</button>`).join('')}function go(k){current=k;renderNav();render()}function render(){let [title,text]=pages[current];if(current==='inicio')main.innerHTML=`<div class=head><div><div class=eyebrow>VISÃO GERAL</div><h1>Bom dia 👋</h1><p>${text}</p></div><button class=btn onclick="alert('Na versão completa, este botão abre o cadastro real de lançamento.')">+ Novo lançamento</button></div><div class=grid><div class=card><span>Saldo total</span><strong>R$ 3.343,24</strong></div><div class=card><span>Entradas no mês</span><strong>R$ 2.500,00</strong></div><div class=card><span>Despesas no mês</span><strong>R$ 1.180,40</strong></div><div class=card><span>Metas</span><strong>2 em andamento</strong></div></div><div class=cols><div class=panel><h3>Evolução mensal</h3><div class=chart>${[48,70,55,88,64,78,96,72].map(x=>`<div class=bar style="height:${x}%"></div>`).join('')}</div></div><div class=panel><h3>Próximos compromissos</h3>${[['Internet','R$ 99,90'],['Academia','R$ 89,90'],['Aluguel','R$ 850,00']].map(x=>`<div class=row><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div></div>`;else main.innerHTML=`<div class=head><div><div class=eyebrow>${title.toUpperCase()}</div><h1>${title}</h1><p>${text}</p></div><button class=btn onclick="alert('A versão completa abre o fluxo correspondente.')">+ Adicionar</button></div><div class=panel><h3>Área ${title}</h3><div class=row><span>Exemplo de conteúdo da V5.1</span><span class=tag>Prévia</span></div><div class=row><span>Interface responsiva</span><span class=tag>Ativo</span></div><div class=row><span>Dados reais</span><span class=tag>Conectado na versão completa</span></div></div>`}renderNav();render();</script></body></html>
