services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meu_controle
      POSTGRES_USER: meu_controle
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meu_controle -d meu_controle"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://meu_controle:change-this-password@postgres:5432/meu_controle
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
