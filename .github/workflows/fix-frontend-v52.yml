name: Fix frontend V5.2
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/fix-frontend-v52.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/main.tsx')
          s=p.read_text()
          s=s.replace(',Home,KeyRound', ',Home as HomeIcon,KeyRound')
          s=s.replace('<Home size={17}/>', '<HomeIcon size={17}/>')
          s=s.replace('<Home size={18}/>', '<HomeIcon size={18}/>')
          marker='function GoalsPage(){'
          if 'function InvestmentModal(' not in s:
              insert='''function InvestmentModal({accounts,onClose,onSaved}:{accounts:Account[];onClose:()=>void;onSaved:()=>void}){\n const [nome,setNome]=useState(''); const [tipo,setTipo]=useState('Renda fixa'); const [instituicao,setInstituicao]=useState(''); const [valor,setValor]=useState(''); const [conta_id,setContaId]=useState(''); const [saving,setSaving]=useState(false);\n async function save(e:React.FormEvent){e.preventDefault();setSaving(true);try{await api.createInvestment({nome,tipo,instituicao,valor_investido:Number(valor),valor_atual:Number(valor),conta_id:conta_id||undefined});onSaved()}finally{setSaving(false)}}\n return <Modal title="Novo investimento" onClose={onClose}><form onSubmit={save} className="modal-form"><label>Nome<input value={nome} onChange={e=>setNome(e.target.value)} required placeholder="Ex.: CDB"/></label><label>Tipo<input value={tipo} onChange={e=>setTipo(e.target.value)} required/></label><label>Instituição<input value={instituicao} onChange={e=>setInstituicao(e.target.value)} placeholder="Opcional"/></label><label>Valor investido<input type="number" step="0.01" min="0" value={valor} onChange={e=>setValor(e.target.value)} required/></label><label>Conta de referência<select value={conta_id} onChange={e=>setContaId(e.target.value)}><option value="">Nenhuma</option>{accounts.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}</select></label><button className="primary-btn" disabled={saving}>{saving?'Salvando...':'Salvar investimento'}<Check size={16}/></button></form></Modal>}\nfunction InvestmentUpdate({investment,onClose,onSaved}:{investment:Investment;onClose:()=>void;onSaved:()=>void}){\n const [valor,setValor]=useState(String(investment.valor_atual)); const [saving,setSaving]=useState(false);\n async function save(e:React.FormEvent){e.preventDefault();setSaving(true);try{await api.updateInvestment(investment.id,{valor_atual:Number(valor)});onSaved()}finally{setSaving(false)}}\n return <Modal title="Atualizar investimento" onClose={onClose}><form onSubmit={save} className="modal-form"><p className="muted">{investment.nome}</p><label>Valor atual<input type="number" step="0.01" min="0" value={valor} onChange={e=>setValor(e.target.value)} required/></label><button className="primary-btn" disabled={saving}>{saving?'Salvando...':'Salvar atualização'}<Check size={16}/></button></form></Modal>}\n'''
              if marker not in s: raise SystemExit('anchor not found')
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          q=Path('frontend/package.json')
          import json
          d=json.loads(q.read_text())
          d['scripts']['build']='vite build'
          q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          env=Path('frontend/src/vite-env.d.ts')
          env.write_text("interface ImportMetaEnv { readonly VITE_API_URL?: string }\ninterface ImportMeta { readonly env: ImportMetaEnv }\n")
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend
          git diff --cached --quiet || git commit -m 'fix: frontend V5.2 build [skip ci]'
          git push
