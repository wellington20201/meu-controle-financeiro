name: Feature transactions and mascot
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply feature patch
        run: python ops/apply-feature-transactions-mascot.py
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/app.ts frontend/src/api.ts frontend/src/main.tsx frontend/src/styles.css ops/apply-feature-transactions-mascot.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: editar excluir lancamentos e mascote 3D interativo [skip ci]"
          git push
