name: Fix runtime schema queries
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime queries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/app.ts')
          s=p.read_text()
          old="SELECT id,nome,limite,comprometido,disponivel FROM cartoes WHERE usuario_id=$1 AND ativo=true ORDER BY nome"
          new="SELECT c.id,c.nome,c.limite,COALESCE((SELECT SUM(p.valor) FROM compras_cartao cc JOIN parcelas_cartao p ON p.compra_id=cc.id WHERE cc.cartao_id=c.id AND p.status='aberta'),0) comprometido,CASE WHEN c.limite IS NULL THEN NULL ELSE c.limite-COALESCE((SELECT SUM(p.valor) FROM compras_cartao cc JOIN parcelas_cartao p ON p.compra_id=cc.id WHERE cc.cartao_id=c.id AND p.status='aberta'),0) END disponivel FROM cartoes c WHERE c.usuario_id=$1 AND c.ativo=true ORDER BY c.nome"
          s=s.replace(old,new)
          s=s.replace("SELECT * FROM memoria_financeira WHERE usuario_id=$1 ORDER BY ocorrencias DESC","SELECT * FROM memoria_financeira WHERE usuario_id=$1 ORDER BY quantidade_ocorrencias DESC")
          s=s.replace("ocorrencias:x.ocorrencias,media:n(x.media_valor)","ocorrencias:x.quantidade_ocorrencias,media:n(x.media_valor)")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/app.ts
          git diff --cached --quiet || git commit -m 'fix: consultas compativeis com schema atual [skip ci]'
          git push